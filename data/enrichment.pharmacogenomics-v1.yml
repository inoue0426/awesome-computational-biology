# Provenance-backed drug-response and pharmacogenomics enrichment batch.
resources:
  beat_aml:
    entities: [cell, disease, drug, gene]
    modalities: [genomics]
    tasks: [drug-response-prediction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://biodev.github.io/BeatAML2/
    dataset_profile:
      species: [human]
      sample_type: patient
      biological_context: cancer
      perturbation_type: [chemical]
      paired: true
      pre_post: false
      longitudinal: false
      drug_identity: true
      dose: true
      smiles: partial
      clinical_outcome: true
      n_samples: "primary AML patient samples"
      n_cells: null
      access: open

  cancer_therapeutics_response_portal_ctrp:
    entities: [cell, drug]
    tasks: [drug-response-prediction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://portals.broadinstitute.org/ctrp/
    dataset_profile:
      species: [human]
      sample_type: cell-line
      biological_context: cancer
      perturbation_type: [chemical]
      paired: true
      pre_post: false
      longitudinal: false
      drug_identity: true
      dose: true
      smiles: partial
      clinical_outcome: false
      n_samples: "~900 cancer cell lines"
      n_cells: null
      access: open

  bindingdb_curated_sets:
    entities: [molecule, protein]
    modalities: [chemical-structure]
    tasks: [drug-target-interaction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://www.bindingdb.org/

  bace:
    entities: [molecule, protein]
    modalities: [chemical-structure]
    tasks: [classification, regression]
    last_checked: 2026-08-08
    metadata_sources:
      - https://www.kaggle.com/datasets/gokturkkoch/bace

  clintox:
    entities: [drug]
    modalities: [clinical]
    tasks: [classification]
    last_checked: 2026-08-08
    metadata_sources:
      - https://tdcommons.ai/single_pred_tasks/tox/#clintox

  sider_side_effect_resource:
    entities: [drug, phenotype]
    modalities: [clinical]
    last_checked: 2026-08-08
    metadata_sources:
      - http://sideeffects.embl.de/

  pk_db:
    entities: [drug]
    modalities: [clinical]
    last_checked: 2026-08-08
    metadata_sources:
      - https://pk-db.com/

  scperturb:
    entities: [cell, drug, gene]
    modalities: [single-cell-rna-seq]
    tasks: [perturbation-prediction]
    github: https://github.com/sanderlab/scPerturb
    last_checked: 2026-10-02
    metadata_sources:
      - https://github.com/sanderlab/scPerturb
    dataset_profile:
      species: [human, mouse]
      sample_type: cell-line
      biological_context: perturbation-collection
      perturbation_type: [chemical, genetic]
      paired: false
      pre_post: false
      longitudinal: false
      drug_identity: true
      dose: partial
      smiles: partial
      clinical_outcome: false
      n_samples: "scPerturb integrated perturbation datasets"
      n_cells: "multi-study single-cell compendium"
      access: open

  genomics_of_drug_sensitivity_in_cancer_gdsc:
    entities: [cell, drug, gene]
    modalities: [genomics]
    tasks: [drug-response-prediction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://www.cancerrxgene.org/
    dataset_profile:
      species: [human]
      sample_type: cell-line
      biological_context: cancer
      perturbation_type: [chemical]
      paired: true
      pre_post: false
      longitudinal: false
      drug_identity: true
      dose: true
      smiles: partial
      clinical_outcome: false
      n_samples: "~1,000 cancer cell lines"
      n_cells: null
      access: open

  cellminer_cross_database_cellminercdb:
    entities: [cell, drug, gene]
    modalities: [genomics]
    tasks: [drug-response-prediction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://discover.nci.nih.gov/cellminercdb/
