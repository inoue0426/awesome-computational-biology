# Provenance-backed single-cell and biomedical benchmark enrichment batch.
resources:
  scmulan:
    entities: [cell, gene]
    methods: [language-model, transformer]
    modalities: [epigenomics, multi-omics, proteomics, single-cell-rna-seq, transcriptomics]
    tasks: [foundation-model-pretraining, representation-learning]
    github: https://github.com/SuperBianC/scMulan
    last_checked: 2026-08-08
    metadata_sources:
      - https://github.com/SuperBianC/scMulan

  proteingym:
    entities: [protein]
    modalities: [protein-sequence]
    tasks: [regression]
    github: https://github.com/OATML-Markslab/ProteinGym
    last_checked: 2026-08-08
    metadata_sources:
      - https://github.com/OATML-Markslab/ProteinGym

  lincs_l1000:
    entities: [cell, compound, gene]
    modalities: [transcriptomics]
    tasks: [perturbation-prediction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://lincsproject.org/LINCS/tools/workflows/find-the-best-place-to-obtain-the-lincs-l1000-data
    dataset_profile:
      year: 2017
      readout: l1000
      gene_panel: "978 landmark genes"
      time: true
      view_scope: full-resource
      species: [human]
      sample_type: cell-line
      biological_context: perturbation-screen
      perturbation_type: [chemical, genetic]
      genetic_modes: [mixed]
      paired: false
      pre_post: false
      longitudinal: false
      drug_identity: true
      dose: true
      smiles: partial
      clinical_outcome: false
      n_samples: "large-scale perturbational profiles"
      n_cells: null
      access: open

  prism:
    entities: [cell, drug]
    tasks: [drug-response-prediction]
    last_checked: 2026-10-02
    metadata_sources:
      - https://depmap.org/portal/prism/
    dataset_profile:
      year: 2020
      readout: viability
      n_compounds: ">4,500"
      n_contexts: ">900 cell lines"
      time: false
      view_scope: full-resource
      species: [human]
      sample_type: cell-line
      biological_context: cancer
      perturbation_type: [chemical]
      paired: true
      pre_post: false
      longitudinal: false
      drug_identity: true
      dose: true
      smiles: partial
      clinical_outcome: false
      n_samples: "PRISM pooled viability screens"
      n_cells: null
      access: open

  pharmgkb:
    entities: [drug, gene, phenotype, variant]
    modalities: [clinical, genomics]
    tasks: [drug-response-prediction]
    last_checked: 2026-08-08
    metadata_sources:
      - https://www.pharmgkb.org/
