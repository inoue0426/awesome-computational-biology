name: Weekly discovery unit tests
on:
  pull_request:
    paths:
      - scripts/weekly_resource_discovery.py
      - tests/test_weekly_resource_discovery.py
      - .github/workflows/weekly-resource-discovery.yml
      - .github/workflows/weekly-resource-discovery-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline discovery tests
        run: python -m unittest discover -s tests -p 'test_weekly_resource_discovery.py'
